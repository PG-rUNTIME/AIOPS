apiVersion: 1
datasources:
  - name: VictoriaMetrics
    uid: vm
    type: prometheus
    url: http://victoriametrics:8428
    isDefault: true
    jsonData: {timeInterval: 15s}
  - name: Loki
    uid: loki
    type: loki
    url: http://loki:3100
    jsonData:
      httpHeaderName1: X-Scope-OrgID
    secureJsonData:
      httpHeaderValue1: demo-bank
  - name: Tempo
    uid: tempo
    type: tempo
    url: http://tempo:3200
