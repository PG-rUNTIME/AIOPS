[project]
name = "agent-gateway"
version = "0.1.0"
description = "Bounded, validated LLM investigation of candidate incidents"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = ["aiops-common","pyyaml>=6.0"]

[project.scripts]
agent-gateway = "agent_gateway.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_gateway"]
