[project]
name = "router"
version = "0.1.0"
description = "Routes verdicts to ServiceNow, Keep, email and chat via an outbox"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = ["aiops-common","sqlalchemy[asyncio]>=2.0.36", "aiosqlite>=0.20", "asyncpg>=0.30", "alembic>=1.14", "pyyaml>=6.0"]

[project.scripts]
router = "router.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/router"]
