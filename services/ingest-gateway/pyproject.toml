[project]
name = "ingest-gateway"
version = "0.1.0"
description = "OTLP/HTTP JSON entry point: tenant auth, PII redaction, Kafka publish"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = ["aiops-common"]

[project.scripts]
ingest-gateway = "ingest_gateway.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingest_gateway"]
