[project]
name = "control-plane-api"
version = "0.1.0"
description = "Tenants, CIs, routing rules, runbooks, thresholds, remediation approvals"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = ["aiops-common","sqlalchemy[asyncio]>=2.0.36", "aiosqlite>=0.20", "asyncpg>=0.30", "alembic>=1.14", "pyjwt[crypto]>=2.9"]

[project.scripts]
control-plane-api = "control_plane.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/control_plane"]
