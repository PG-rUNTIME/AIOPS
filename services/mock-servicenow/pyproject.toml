[project]
name = "mock-servicenow"
version = "0.1.0"
description = "Dev/test mock of ServiceNow Event Management and Table APIs"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = ["aiops-common"]

[project.scripts]
mock-servicenow = "mock_servicenow.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mock_servicenow"]
