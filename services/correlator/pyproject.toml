[project]
name = "correlator"
version = "0.1.0"
description = "Groups signals per CI into candidate incidents"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = ["aiops-common", "pyyaml>=6.0", "sqlalchemy[asyncio]>=2.0.36", "aiosqlite>=0.20", "asyncpg>=0.30"]

[project.scripts]
correlator = "correlator.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/correlator"]
