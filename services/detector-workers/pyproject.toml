[project]
name = "detector-workers"
version = "0.1.0"
description = "Forecasting, anomaly and log-template detectors"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = ["aiops-common","numpy>=2.0", "scikit-learn>=1.5", "drain3>=0.9.11", "pyyaml>=6.0"]

[project.optional-dependencies]
chronos = ["chronos-forecasting>=2.0", "pandas>=2.2"]

[project.scripts]
detector-workers = "detector_workers.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/detector_workers"]
