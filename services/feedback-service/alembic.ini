[alembic]
script_location = %(here)s/alembic
# URL comes from AIOPS_DATABASE_URL (sync driver is derived automatically).

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic
[formatter_generic]
format = %(levelname)s %(name)s %(message)s
