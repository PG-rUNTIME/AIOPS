[project]
name = "feedback-service"
version = "0.1.0"
description = "Outcome labels and precision/recall/lead-time KPIs"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = ["aiops-common","sqlalchemy[asyncio]>=2.0.36", "aiosqlite>=0.20", "asyncpg>=0.30", "alembic>=1.14"]

[project.scripts]
feedback-service = "feedback_service.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/feedback_service"]
