[project]
name = "aiops-common"
version = "0.1.0"
description = "Shared contracts, Kafka helpers, telemetry and config for AIOps services"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6",
  "aiokafka>=0.11",
  "httpx>=0.27",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "prometheus-client>=0.21",
  "jsonschema>=4.23",
  "pyyaml>=6.0",
  "opentelemetry-api>=1.28",
  "opentelemetry-sdk>=1.28",
  "opentelemetry-exporter-otlp-proto-http>=1.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiops_common"]
